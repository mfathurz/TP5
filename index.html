
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ruang Baca</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">


    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #198754;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Ruang Baca</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarMenu"
                aria-controls="navbarMenu" aria-expanded="false"
                aria-label="Buka navigasi">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Beranda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Tentang</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Bantuan</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>


    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

                <div class="card border-0 shadow">
                    <div class="card-body p-4">

                        <h2 class="text-center fw-bold fs-4 mb-2">
                            Masuk ke Ruang Baca
                        </h2>

                        <p class="text-center text-secondary small mb-4">
                            Temukan bacaan untuk hari ini.
                        </p>

                        <form>
                            <div class="mb-3">
                                <label for="username" class="form-label small mb-1">
                                    Username
                                </label>
                                <input type="text" class="form-control form-control-sm"
                                    id="username" placeholder="Masukkan username">
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label small mb-1">
                                    Password
                                </label>
                                <input type="password" class="form-control form-control-sm"
                                    id="password" placeholder="Masukkan password">
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox"
                                    id="ingatSaya">
                                <label class="form-check-label small" for="ingatSaya">
                                    Ingat saya
                                </label>
                            </div>

                            <button type="button"
                                class="btn btn-success btn-sm w-100">
                                Masuk
                            </button>
                        </form>

                    </div>

                    <div class="card-footer bg-light text-center py-3">
                        <a href="#" class="text-success small">
                            Lupa password?
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
